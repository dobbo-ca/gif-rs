# The public GIF sets of the parity gates (docs/design.md, "Parity output format"). fetch.sh
# downloads each [[file]] once into the BuildKit cache mount id=gif-rs-data, checks size and
# sha256, and extracts the .gif files under `extract` (space separated files or directories of
# the archive's top directory) into <dir>/x/<name>/. `name` is the top directory of the archive.
# An empty sha256 is not checked: fetch.sh prints the PIN line to write here and exits 3.
# Nothing here is copied into the repo: the files are read in CI and never redistributed.

# giflib 5.2.1 (MIT, COPYING). pic/: the sample images of giflib; pic/NOTES says only solid2.gif
# was made by the author, and two came from usenet. They ship inside the MIT package; used as test
# input only. tests/wedge.gif: made by giflib's own gifwedge. doc/whatsinagif is not used.
[[file]]
name = "giflib-5.2.1"
path = "giflib_5.2.1.orig.tar.gz"
url = "https://deb.debian.org/debian/pool/main/g/giflib/giflib_5.2.1.orig.tar.gz"
size = 444187
sha256 = ""
license = "MIT"
extract = "pic tests/wedge.gif"

# image-rs/image-gif v0.13.1 (MIT OR Apache-2.0). Only files made for the repo: the fuzz and
# stall regression files and the hand-made 2x2.gif. The other tests/samples files have no known
# origin (moon_impact, alpha_gif_a, anim-gr, sample_1, sample_big, set_hsts, beacon, interlaced)
# and are skipped; gifplayer-muybridge.gif is the Wuffs file below.
[[file]]
name = "image-gif-0.13.1"
path = "image-gif-0.13.1.tar.gz"
url = "https://github.com/image-rs/image-gif/archive/refs/tags/v0.13.1.tar.gz"
size = 12497283
sha256 = ""
license = "MIT OR Apache-2.0"
extract = "tests/crashtest tests/stall tests/samples/2x2.gif"

# google/wuffs at a pinned commit (Apache-2.0, LICENSE). test/data/README.md names the source of
# each GIF: original work of Nigel Tao (animated-red-blue, bricks-*, gifplayer-muybridge,
# transparent-1x1, artificial-gif/*), the Muybridge animation (public domain, Wikipedia), Met
# Museum public domain photos (harvesters, hat, hibiscus.*, hippopotamus.*) and pjw-thumbnail
# (derived from a photo by Rob Pike, in the repo under Apache-2.0). The README says nothing
# against any other .gif of test/data; the coordinator must check this when the commit is bumped.
[[file]]
name = "wuffs-a87f0bb85b9406d29f48a1c03b6f42c4585145f6"
path = "wuffs-a87f0bb.tar.gz"
url = "https://github.com/google/wuffs/archive/a87f0bb85b9406d29f48a1c03b6f42c4585145f6.tar.gz"
size = 15841044
sha256 = ""
license = "Apache-2.0"
extract = "test/data"

# netsurf-browser/libnsgif release 1.0.0 (MIT, COPYING). test/data: hand-made edge-case GIFs of
# the libnsgif authors (clipping, disposal, empty files, extensions). test/ns-afl-gif: afl
# mutations of those files, in the same MIT repo. The names hold ':' and ',', which is fine.
[[file]]
name = "libnsgif-release-1.0.0"
path = "libnsgif-release-1.0.0.tar.gz"
url = "https://github.com/netsurf-browser/libnsgif/archive/refs/tags/release/1.0.0.tar.gz"
size = 283266
sha256 = ""
license = "MIT"
extract = "test/data test/ns-afl-gif"
